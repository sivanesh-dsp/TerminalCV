# SSH-ONLY deployment — use this when the website is hosted elsewhere
# (e.g. your Vercel site at https://terminal-cv-xi.vercel.app).
#
# On a small Linux server with a public IP:
#   git clone <this-repo> && cd terminal-resume
#   docker compose -f docker-compose.ssh.yml up -d --build
#
# Then visitors connect with:
#   ssh sivanesh@<server-ip-or-domain>

services:
  ssh:
    build:
      context: .
      dockerfile: ssh/Dockerfile
      args:
        VERSION: ${VERSION:-1.0.0}
    image: portfolio-ssh:latest
    environment:
      # Point the SSH `resume` / `contact` / links back at the Vercel website.
      WEB_URL: ${WEB_URL:-https://terminal-cv-xi.vercel.app}
      RESUME_URL: ${RESUME_URL:-https://terminal-cv-xi.vercel.app/Sivanesh_B_Platform_DevOps_Engineer_Resume.pdf}
      DEFAULT_USER: sivanesh
      IDLE_TIMEOUT: 5m
      MAX_TIMEOUT: 60m
    ports:
      # Host port 22 -> container 2222 (see notes about the host's own sshd).
      - "${SSH_PORT:-22}:2222"
    volumes:
      - ssh_data:/data # persists the host key + visitor stats across restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  ssh_data:
