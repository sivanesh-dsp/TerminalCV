# Alternative to Caddy: serve the built React site (dist/) with Nginx.
# TLS termination is assumed to happen here or at an upstream load balancer.
# (Caddy is recommended because it handles HTTPS certificates automatically.)

server {
    listen 80;
    server_name mydomain.dev;
    root /srv;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Content-hashed assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else falls back to the SPA entry point.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
    }

    # The résumé PDF is a real file and is served directly.
    location = /Sivanesh_B_Platform_DevOps_Engineer_Resume.pdf {
        try_files $uri =404;
    }
}
