# Portfolio: React website (Caddy, auto-HTTPS) + interactive SSH server + REST
# API + MCP server.
#
#   cp .env.example .env      # then edit DOMAIN etc.
#   docker compose up -d --build
#
# Web:  https://${DOMAIN}
# SSH:  ssh ${DOMAIN}   (host port ${SSH_PORT}) — any username is accepted
# API:  https://${DOMAIN}/api/v1  ·  docs at /api/docs
# MCP:  https://${DOMAIN}/mcp    (Streamable HTTP, for ChatGPT/Claude/agents)
#
# The website, the SSH terminal and the API all read the SAME
# shared/resume.json — there is no duplicated data. The MCP server holds no
# résumé data at all; it only calls the API above.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_BASE: /
    image: portfolio-web:latest
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Persist Caddy access logs on the VM (survives container rebuilds).
      - ./logs/web:/var/log/caddy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2021/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  ssh:
    build:
      context: .
      dockerfile: ssh/Dockerfile
      args:
        VERSION: ${VERSION:-1.0.0}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: portfolio-ssh:latest
    environment:
      IDLE_TIMEOUT: 5m
      MAX_TIMEOUT: 60m
      # Advertised in the SSH `Contact` tab; the SSH server itself reads the
      # shared résumé file directly (same source of truth, no HTTP hop).
      RESUME_API_URL: ${RESUME_API_URL:-https://${DOMAIN:-localhost}/api/v1}
      # Durable log file on a host bind mount (also written to stdout).
      LOG_FILE: /var/log/portfolio/ssh.log
      # Scanner/bot probe IPs (no PTY) are recorded here for fail2ban.
      PROBE_LOG: /var/log/portfolio/probes.log
    ports:
      # Host ${SSH_PORT} -> container 2222. Set SSH_PORT=22 in production
      # (ensure the host's own sshd uses a different port).
      - "${SSH_PORT:-2222}:2222"
    volumes:
      - ssh_data:/data
      # Persist SSH server logs on the VM, next to the web logs.
      - ./logs/ssh:/var/log/portfolio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ---------------------------------------------------------------------------
  # Résumé REST API (https://<domain>/api/v1) — built from the sibling
  # `resume-api` repository. The shared résumé JSON is mounted READ-ONLY: the
  # API keeps no copy of the data, so this file stays the single source of truth.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ${RESUME_API_CONTEXT:-../resume-api}
      dockerfile: Dockerfile
    image: resume-api:latest
    environment:
      ENVIRONMENT: ${API_ENVIRONMENT:-production}
      LOG_FORMAT: json
      LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      RESUME_PATH: /data/resume.json
      RESUME_PDF_PATH: /data/resume.pdf
      SITE_URL: https://${DOMAIN:-localhost}
      CORS_ALLOW_ORIGINS: ${API_CORS_ALLOW_ORIGINS:-https://${DOMAIN:-localhost}}
      METRICS_ENABLED: ${API_METRICS_ENABLED:-true}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: ${API_RATE_LIMIT_REQUESTS:-120}
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - ./shared/resume.json:/data/resume.json:ro
      - ./public/Sivanesh_B_Platform_DevOps_Engineer_Resume.pdf:/data/resume.pdf:ro
    # No published ports: the API is only reachable through the Caddy proxy.
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ---------------------------------------------------------------------------
  # Résumé MCP server (https://<domain>/mcp) — built from the sibling
  # `resume-mcp` repository. It holds no résumé data itself; it only calls
  # the `api` service above over the internal Docker network.
  # ---------------------------------------------------------------------------
  mcp:
    build:
      context: ${RESUME_MCP_CONTEXT:-../resume-mcp}
      dockerfile: Dockerfile
    image: resume-mcp:latest
    depends_on:
      - api
    environment:
      ENVIRONMENT: ${MCP_ENVIRONMENT:-production}
      LOG_FORMAT: json
      LOG_LEVEL: ${MCP_LOG_LEVEL:-INFO}
      # Internal Docker network URL — never the public one.
      RESUME_API_URL: http://api:8000/api/v1
      SITE_URL: https://${DOMAIN:-localhost}
      METRICS_ENABLED: ${MCP_METRICS_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${MCP_RATE_LIMIT_REQUESTS:-120}
      TRUST_PROXY_HEADERS: "true"
      # Must match the Host header Caddy forwards for /mcp*, derived from
      # DOMAIN below — override explicitly if the two ever diverge.
      TRANSPORT_ALLOWED_HOSTS: ${DOMAIN:-localhost},${DOMAIN:-localhost}:*
      TRANSPORT_ALLOWED_ORIGINS: https://${DOMAIN:-localhost}
    # No published ports: only reachable through the Caddy proxy.
    expose:
      - "8001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  caddy_data:
  caddy_config:
  ssh_data: